yamltitle: 'Susan Blair Collected'
description: 'Operational case studies, Product Manager toolbox tips, Strategies for Success, so forth.'
theme: minima

baseurl: "/SBCollected"
url: "https://github.io"
defaults:
  - scope:
      path: ""       # An empty string means look across the entire project repository
      type: "posts"  # This targets every single post file, even those deep in subfolders
    values:
      categories: [] # Strips out the folder-based categories automatically
